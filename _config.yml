# 공부 기록 — Beautiful Jekyll 6.0.1 기반 (theme LICENSE: MIT, LICENSE 파일 참고)
# 사이트 전체 설정. 글은 _posts/, 페이지는 루트의 .md/.html.

title: AI Robotics Researcher
author: AI Robotics Researcher
baseurl: "/Docs"
url: "https://chanyee725.github.io"

# 위쪽 메뉴. 시리즈는 태그 페이지의 해당 태그로 연결한다.
navbar-links:
  VLA: "tags#VLA"
  논문: "tags#논문"
  글 목록: "posts"
  CV: "cv"

# 프로필 사진 (지금은 데모 그림. 실제 사진으로 바꿀 때 이 파일만 교체)
avatar: "/assets/img/avatar.svg"
round-avatar: true

social-network-links:
  github: chanyee725
  rss: true

rss-description: 로봇 학습(VLA)을 공부하며 한 것과 배운 것

share-links-active:
  twitter: false
  facebook: false
  linkedin: false
  vk: false

excerpt_length: 60
feed_show_excerpt: true
feed_show_tags: true
post_search: true
edit_page_button: false

# 색: 흰 바탕, 흑연색 글자, 링크는 차분한 파랑 하나
navbar-var-length: false
navbar-col: "#F5F5F5"
navbar-text-col: "#404040"
navbar-border-col: "#EAEAEA"
page-col: "#FFFFFF"
text-col: "#404040"
link-col: "#2557D6"
hover-col: "#173C99"
footer-col: "#F5F5F5"
footer-text-col: "#8A8A8A"
footer-link-col: "#555555"
footer-hover-col: "#173C99"

site-css:
  - "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
  - "/assets/css/custom.css"

date_format: "%Y. %-m. %-d."
timezone: "Asia/Seoul"
lang: ko

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/
paginate: 10

kramdown:
  input: GFM

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      social-share: false
  - scope:
      path: ""
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - templates/
  - vendor/
  - _config.dev.yml

plugins:
  - jekyll-paginate
  - jekyll-sitemap
