# ── CV 페이지(/cv)에만 나오는 항목 ──
# education: period(기간), title(학교·학과), note(상태 등)
education:
  - period: YYYY.MM – YYYY.MM
    title: 학교 · 학과
    note: 졸업 예정

# languages: title(시험), score(점수), date(응시 연월)
languages:
