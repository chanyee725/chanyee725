# 첫 화면 프로필. 아래 예시를 실제 내용으로 바꿔 쓴다.
name: Byungchan Kim
label: Currently Exploring
mission: 말을 이해하고 안전하게 움직이는 로봇 정책

# career: role(직책), org(회사), period(기간). 위에서부터 보인다 (최신을 위에)
