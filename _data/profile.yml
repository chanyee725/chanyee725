# 첫 화면 프로필. 아래 예시를 실제 내용으로 바꿔 쓴다.
name: 이름
label: Currently Exploring
mission: VLA로 로봇이 배우는 방법을 이해하고 직접 만들어 보기

# awards: title(대회), prize(상), org(주최), date(연월, 없으면 생략)
# certifications: title(자격증), org(발급 기관), date(취득 연월)
awards:
  - title: 교내 해커톤 대회
    prize: 대상
  - title: 전공동아리 프로젝트 발표회
    prize: 최우수상
  - title: 임베디드 해커톤
    prize: 우수상
  - title: 임베디드 IoT 웹 프로젝트 경진대회
    prize: 장려상

certifications:
  - title: 자격증 이름
    org: 발급 기관
    date: YYYY.MM

# ── CV 페이지(/cv)에만 나오는 항목 ──
# education: period(기간), title(학교·학과), note(상태 등)
education:
  - period: YYYY.MM – YYYY.MM
    title: 학교 · 학과
    note: 졸업 예정

# languages: title(시험), score(점수), date(응시 연월)
languages:
  - title: TOEIC
    score: 점수
    date: YYYY.MM
