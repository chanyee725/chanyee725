# certifications: title(자격증), org(발급 기관), date(취득 연월)
awards:
  - title: 교내 해커톤 대회
    prize: 대상
    org: 부산소프트웨어마이스터고등학교
  - title: 전공동아리 프로젝트 발표회
    prize: 최우수상
    org: 부산소프트웨어마이스터고등학교
  - title: 임베디드 해커톤
    prize: 우수상
    org: 부산소프트웨어마이스터고등학교
  - title: 임베디드 IoT 웹 프로젝트 경진대회
    prize: 장려상
    org: 부산소프트웨어마이스터고등학교

certifications:
  - title: 자격증 이름
    org: 발급 기관
